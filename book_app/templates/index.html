<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Список книг</h1>
    <ul>
        {%for book in books%}
        <li>
            <h3>{{book.title}}</h3>
            <p>{{book.date}}</p>
            <p>{{book.price}}</p>
            <a href="/author/{{ book.author.id }}">{{ book.author.name }}</a>
        </li>
        {%endfor%}
    </ul>
</body>
</html>
